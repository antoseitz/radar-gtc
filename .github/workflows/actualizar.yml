name: Actualizar Radar GTC

# Corre cada 15 minutos, todos los dias. El programa decide solo que hacer:
#  - Dias habiles: calculo completo cada hora y, entre medio, solo precios (1-3 min).
#  - Fin de semana: noticias, futuros y bitcoin cada hora (las bolsas estan cerradas).
#  - Boton "Run workflow": siempre hace el calculo completo.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar librerias
        run: pip install -r requirements.txt
      - name: Descargar datos (completo o rapido)
        id: datos
        env:
          RADAR_KRONOS: "0"
          SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python radar_gtc.py --auto
          cp docs/index.html docs/wls.html
      - uses: actions/configure-pages@v5
        if: steps.datos.outputs.publicar == 'si'
      - uses: actions/upload-pages-artifact@v3
        if: steps.datos.outputs.publicar == 'si'
        with:
          path: docs
      - name: Publicar pagina
        id: deployment
        if: steps.datos.outputs.publicar == 'si'
        uses: actions/deploy-pages@v4
