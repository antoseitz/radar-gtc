name: Actualizar Radar GTC (completo, cada hora)

# Analisis completo: radar, universo WLS, candidatas de la Mesa. Puede tardar 20-60 min.
# Los precios cada 15 min los hace el otro flujo (rapido.yml), que ademas lanza este cada hora.
# Boton "Run workflow": hace el analisis completo de inmediato.
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: completo
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      publicar: ${{ steps.datos.outputs.publicar }}
      inicio: ${{ steps.inicio.outputs.t }}
    steps:
      - id: inicio
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar librerias
        run: pip install -r requirements.txt
      - name: Analisis completo
        id: datos
        env:
          RADAR_KRONOS: "0"
          MODO: completo
          SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python radar_gtc.py --auto
          cp docs/index.html docs/wls.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.datos.outputs.publicar == 'si'
        with:
          path: docs

  publicar:
    needs: datos
    if: needs.datos.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4

