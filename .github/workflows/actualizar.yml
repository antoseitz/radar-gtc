name: Actualizar Radar GTC

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 08:30 Chile, antes de la apertura
    - cron: "15 21 * * 1-5"   # 18:15 Chile, despues del cierre
  workflow_dispatch:          # boton "Run workflow" para actualizar a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar librerias y Kronos
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          git clone --depth 1 https://github.com/shiyu-coder/Kronos Kronos
      - name: Guardar el modelo Kronos entre ejecuciones
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-v1
      - name: Descargar datos de Yahoo Finance y correr Kronos
        env:
          RADAR_KRONOS: "0"
          KRONOS_DIR: Kronos
        run: python radar_gtc.py docs/radar_gtc.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
