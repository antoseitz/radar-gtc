name: Precios cada 15 min (rapido)

# Precios, noticias, VIX/dolar y acciones en tendencia. Termina en pocos minutos y no espera al analisis completo.
# Al final deja lanzada la siguiente (15 min) y, si paso ~1 hora, tambien el analisis completo.

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: rapido
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publicar: ${{ steps.datos.outputs.publicar }}
      inicio: ${{ steps.inicio.outputs.t }}
    steps:
      - id: inicio
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar librerias
        run: pip install -r requirements.txt
      - name: Precios, noticias y panorama
        id: datos
        env:
          RADAR_KRONOS: "0"
          MODO: rapido
          SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MANUAL: "false"
        run: |
          python radar_gtc.py --auto
          cp docs/index.html docs/wls.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.datos.outputs.publicar == 'si'
        with:
          path: docs

  publicar:
    needs: datos
    if: needs.datos.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub a veces no lanza las ejecuciones programadas (cron). Por eso cada ejecucion deja programada la siguiente:
  # espera a que se cumplan 15 min desde que partio y la lanza, salvo que ya haya otra en cola o corriendo.
  siguiente:
    needs: [datos, publicar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Esperar y lanzar la siguiente
        run: |
          dow=$(date -u +%u); hora=$(date -u +%H)
          minutos=15
          if [ "$dow" = "6" ] || { [ "$dow" = "7" ] && [ "$hora" -lt 22 ]; }; then
            minutos=60; echo "Fin de semana: la cadena sigue, pero cada 60 min"
          fi
          inicio=${{ needs.datos.outputs.inicio }}
          [ -z "$inicio" ] && inicio=$(date +%s)
          espera=$(( inicio + minutos*60 - $(date +%s) ))
          if [ "$espera" -gt 0 ]; then echo "Esperando $espera s"; sleep "$espera"; fi
          wf=rapido.yml
          otras=$(gh run list --workflow "$wf" -L 20 --json databaseId,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length' 2>/dev/null || echo 0)
          if [ "$otras" != "0" ]; then echo "Ya hay otra ejecucion en cola o corriendo ($otras): no lanzo otra"; exit 0; fi
          gh workflow run "$wf" --ref "${{ github.ref_name }}"
          echo "Siguiente ejecucion lanzada"
      - name: Lanzar el analisis completo si ya corresponde (cada ~60 min)
        if: always()
        run: |
          dow=$(date -u +%u); hora=$(date -u +%H)
          if [ "$dow" = "6" ] || { [ "$dow" = "7" ] && [ "$hora" -lt 22 ]; }; then echo "Fin de semana: el completo lo lanza el horario"; exit 0; fi
          activos=$(gh run list --workflow actualizar.yml -L 10 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length' 2>/dev/null || echo 1)
          if [ "$activos" != "0" ]; then echo "El completo ya esta corriendo o en cola"; exit 0; fi
          ultimo=$(gh run list --workflow actualizar.yml -L 1 --json createdAt --jq '.[0].createdAt // ""' 2>/dev/null || echo "")
          edad=999
          if [ -n "$ultimo" ]; then edad=$(( ( $(date +%s) - $(date -d "$ultimo" +%s) ) / 60 )); fi
          echo "Ultimo completo hace $edad min"
          if [ "$edad" -ge 55 ]; then gh workflow run actualizar.yml --ref "${{ github.ref_name }}"; echo "Completo lanzado"; fi
