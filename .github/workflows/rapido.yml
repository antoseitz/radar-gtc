name: Precios cada 15 min (rapido)

# Precios, noticias, VIX/dolar y acciones en tendencia. Termina en pocos minutos y no espera al analisis completo.

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rapido
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publicar: ${{ steps.datos.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar librerias
        run: pip install -r requirements.txt
      - name: Precios, noticias y panorama
        id: datos
        env:
          RADAR_KRONOS: "0"
          MODO: rapido
          SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MANUAL: "false"
        run: |
          python radar_gtc.py --auto
          cp docs/index.html docs/wls.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.datos.outputs.publicar == 'si'
        with:
          path: docs

  publicar:
    needs: datos
    if: needs.datos.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
